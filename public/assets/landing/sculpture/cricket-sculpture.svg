<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <defs>
    <linearGradient id="metallicBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C5A059" />
      <stop offset="40%" stopColor="#8C6D3B" />
      <stop offset="70%" stopColor="#5E4823" />
      <stop offset="100%" stopColor="#3B2E15" />
    </linearGradient>
    <filter id="metallicRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g filter="url(#metallicRelief)" transform="translate(100, 100) scale(1.1)">
    {/* Head */}
    <circle cx="20" cy="-60" r="10" fill="url(#metallicBronze)" />
    
    {/* Body & Legs in Dynamic Hook/Pull Shot Pose */}
    <path d="M-15,30 Q-5,10 0,-15 Q5,-35 15,-45" stroke="url(#metallicBronze)" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M-28,80 L-15,30 L10,85" stroke="url(#metallicBronze)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    {/* Swung Bat & Arms */}
    <path d="M12,-35 L40,-15 L-20,-70" stroke="url(#metallicBronze)" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M-20,-70 L-35,-85 L-40,-75 L-25,-60 Z" fill="url(#metallicBronze)" />
    
    {/* Orbital Motion Ring */}
    <ellipse cx="0" cy="-20" rx="60" ry="45" stroke="url(#metallicBronze)" stroke-width="4" stroke-linecap="round" stroke-dasharray="120 40" transform="rotate(-25)" fill="none" />
  </g>

  {/* Carved Typography Underneath */}
  <text x="100" y="240" font-family="'Oswald', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="3">INDIAN</text>
  <text x="100" y="260" font-family="'Oswald', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="3">PREMIER</text>
  <text x="100" y="280" font-family="'Oswald', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle" letter-spacing="3">LEAGUE</text>
</svg>
