<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="pedestalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2A2A2A" />
      <stop offset="50%" stopColor="#1E1E1E" />
      <stop offset="100%" stopColor="#141414" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2A3" />
      <stop offset="25%" stopColor="#F9D47B" />
      <stop offset="50%" stopColor="#E5B232" />
      <stop offset="80%" stopColor="#B8860B" />
      <stop offset="100%" stopColor="#8A6208" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.35" />
      <stop offset="30%" stopColor="#FFFFFF" stopOpacity="0.05" />
      <stop offset="70%" stopColor="#2074D5" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.2" />
    </linearGradient>
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#F9D47B" flood-opacity="0.35" />
    </filter>
  </defs>

  {/* Concrete / Stone Pedestal Base */}
  <g id="pedestal">
    <rect x="50" y="270" width="200" height="170" fill="url(#pedestalDark)" stroke="#444" stroke-width="2" />
    {/* Pedestal Bevel */}
    <polygon points="40,270 50,260 250,260 260,270" fill="#383838" />
    {/* Carved Motto on Pedestal */}
    <text x="150" y="340" font-family="'Oswald', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle" letter-spacing="4">MORE</text>
    <text x="150" y="365" font-family="'Oswald', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle" letter-spacing="4">THAN</text>
    <text x="150" y="390" font-family="'Oswald', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle" letter-spacing="4">A GAME</text>
  </g>

  {/* Glass Display Case Frame */}
  <g id="glassCase">
    {/* Back Glass */}
    <rect x="55" y="45" width="190" height="215" fill="#141414" fill-opacity="0.4" />
    
    {/* Inside Trophy: Golden TATA IPL Cup */}
    <g id="cup" filter="url(#trophyGlow)" transform="translate(150, 150)">
      {/* Trophy Plinth */}
      <rect x="-35" y="70" width="70" height="18" rx="2" fill="#181818" stroke="#F9D47B" stroke-width="1.5" />
      <rect x="-42" y="88" width="84" height="10" fill="#0E0E0E" stroke="#444" />
      
      {/* Cup Stem & Base */}
      <path d="M-15,40 L-25,70 L25,70 L15,40 Z" fill="url(#goldGleam)" stroke="#E5B232" stroke-width="1" />
      <ellipse cx="0" cy="40" rx="18" ry="6" fill="#FFF2A3" />

      {/* Main Goblet Body */}
      <path d="M-40,-30 C-45,30 -25,40 0,40 C25,40 45,30 40,-30 Z" fill="url(#goldGleam)" stroke="#E5B232" stroke-width="1.5" />
      <ellipse cx="0" cy="-30" rx="40" ry="12" fill="#FFE082" stroke="#E5B232" />
      
      {/* Cup Lid & Finial */}
      <path d="M-36,-32 C-30,-55 30,-55 36,-32 Z" fill="url(#goldGleam)" stroke="#E5B232" />
      <ellipse cx="0" cy="-55" rx="8" ry="4" fill="#FFE082" />
      <circle cx="0" cy="-62" r="5" fill="#FFF2A3" stroke="#B8860B" />

      {/* Ornate Handles */}
      <path d="M-38,-20 C-75,-25 -70,25 -25,25" fill="none" stroke="url(#goldGleam)" stroke-width="7" stroke-linecap="round" />
      <path d="M38,-20 C75,-25 70,25 25,25" fill="none" stroke="url(#goldGleam)" stroke-width="7" stroke-linecap="round" />

      {/* Ribbon Straps (TATA blue ribbons on sides) */}
      <rect x="-58" y="0" width="10" height="85" fill="#2074D5" rx="1" />
      <text x="-53" y="45" font-family="'Oswald', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90, -53, 45)" letter-spacing="1">TATA</text>
      
      <rect x="48" y="0" width="10" height="85" fill="#2074D5" rx="1" />
      <text x="53" y="45" font-family="'Oswald', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle" transform="rotate(90, 53, 45)" letter-spacing="1">TATA</text>
    </g>

    {/* Front Glass Reflections & Technical Edges */}
    <rect x="55" y="45" width="190" height="215" fill="url(#glassSheen)" stroke="#666" stroke-width="1.5" />
    <line x1="60" y1="50" x2="110" y2="255" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
    <line x1="80" y1="50" x2="130" y2="255" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />
    <rect x="52" y="42" width="196" height="6" fill="#333" />
  </g>
</svg>
