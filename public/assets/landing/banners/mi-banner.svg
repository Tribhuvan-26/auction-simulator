<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 500" fill="none">
  <defs>
    <linearGradient id="miBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#004BA0" />
      <stop offset="50%" stopColor="#2074D5" />
      <stop offset="100%" stopColor="#0B3C78" />
    </linearGradient>
    <linearGradient id="fabricFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.4" />
      <stop offset="30%" stopColor="#FFFFFF" stopOpacity="0.1" />
      <stop offset="70%" stopColor="#000000" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  {/* Hanging Banner Fabric */}
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="140" height="470" rx="3" fill="url(#miBlue)" />
    <rect x="10" y="10" width="140" height="470" rx="3" fill="url(#fabricFold)" />
    
    {/* Hanging Grommets/Tethers */}
    <circle cx="25" cy="22" r="5" fill="#141414" stroke="#888" stroke-width="2" />
    <circle cx="135" cy="22" r="5" fill="#141414" stroke="#888" stroke-width="2" />
    
    {/* MI Crest Artwork */}
    <g transform="translate(80, 180) scale(1.1)">
      {/* Cyclone Vortex */}
      <path d="M-30,-20 C-10,-50 30,-50 40,-20 C50,10 20,40 -10,35 C-30,30 -40,10 -35,-10" stroke="#F9D47B" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M-20,-10 C-5,-30 20,-30 28,-10 C35,10 15,28 -5,24" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" />
      
      {/* MI Monogram */}
      <text x="0" y="45" font-family="'Oswald', 'Impact', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MI</text>
    </g>

    {/* Typography */}
    <text x="80" y="320" font-family="'Oswald', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MUMBAI</text>
    <text x="80" y="345" font-family="'Oswald', sans-serif" font-weight="800" font-size="20" fill="#F9D47B" text-anchor="middle" letter-spacing="4">INDIANS</text>
    
    {/* Bottom decorative hem */}
    <line x1="20" y1="460" x2="140" y2="460" stroke="#F9D47B" stroke-width="3" stroke-dasharray="8 4" />
  </g>
</svg>
