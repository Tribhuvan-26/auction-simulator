<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 500" fill="none">
  <defs>
    <linearGradient id="cskYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFCC00" />
      <stop offset="50%" stopColor="#F9D47B" />
      <stop offset="100%" stopColor="#E5A600" />
    </linearGradient>
    <linearGradient id="cskFabricFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#000000" stopOpacity="0.35" />
      <stop offset="30%" stopColor="#FFFFFF" stopOpacity="0.2" />
      <stop offset="70%" stopColor="#000000" stopOpacity="0.25" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.5" />
    </linearGradient>
    <filter id="cskShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#cskShadow)">
    <rect x="10" y="10" width="140" height="470" rx="3" fill="url(#cskYellow)" />
    <rect x="10" y="10" width="140" height="470" rx="3" fill="url(#cskFabricFold)" />
    
    {/* Hanging Grommets */}
    <circle cx="25" cy="22" r="5" fill="#141414" stroke="#888" stroke-width="2" />
    <circle cx="135" cy="22" r="5" fill="#141414" stroke="#888" stroke-width="2" />
    
    {/* CSK Roaring Lion Crest */}
    <g transform="translate(80, 180) scale(1.05)">
      {/* Lion Profile Vector */}
      <path d="M-35,-30 Q-15,-60 20,-45 Q45,-30 40,5 Q35,35 10,40 Q-25,45 -35,15 Z" fill="#2074D5" fill-opacity="0.15" />
      <path d="M-30,-20 Q-10,-45 25,-30 Q35,-10 30,10 Q20,30 0,35 Q-20,35 -30,15" stroke="#2074D5" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M-20,-10 L-5,-20 L10,-10 L25,-15 L20,5 L5,15 L-10,10 Z" fill="#2074D5" />
      {/* Crown Elements */}
      <path d="M-15,-45 L-5,-60 L5,-45 L15,-58 L25,-42" stroke="#E5A600" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    {/* Typography */}
    <text x="80" y="305" font-family="'Oswald', sans-serif" font-weight="900" font-size="22" fill="#141414" text-anchor="middle" letter-spacing="3">CHENNAI</text>
    <text x="80" y="330" font-family="'Oswald', sans-serif" font-weight="900" font-size="22" fill="#2074D5" text-anchor="middle" letter-spacing="3">SUPER KINGS</text>
    
    {/* Bottom decorative hem */}
    <line x1="20" y1="460" x2="140" y2="460" stroke="#2074D5" stroke-width="3" stroke-dasharray="8 4" />
  </g>
</svg>
